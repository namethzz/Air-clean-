services:
  - type: web
    name: aircare-connect-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/AirCare.Api/Dockerfile
    dockerContext: ./backend/AirCare.Api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: aircareconnect_live
      - key: JWT_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: false
      - key: FRONTEND_ORIGIN
        value: https://aircare-connect-web.onrender.com
      # Password reset email. Without SMTP, an admin creates reset links on the "ตรวจสอบช่าง" page.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
