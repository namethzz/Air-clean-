services:
  - type: web
    name: aircare-connect-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/AirCare.Api/Dockerfile
    dockerContext: ./backend/AirCare.Api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: aircareconnect_live
      - key: JWT_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: false
      - key: FRONTEND_ORIGIN
        value: https://aircare-connect-web.onrender.com
      # Password reset email. Render's free plan blocks outbound SMTP, so set BREVO_API_KEY (sent over HTTPS)
      # and SMTP_FROM; the SMTP_* server settings are only used when BREVO_API_KEY is empty.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Sign in with Google / Apple. Leave empty to hide that option. The static site needs the same IDs
      # as VITE_GOOGLE_CLIENT_ID / VITE_APPLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
