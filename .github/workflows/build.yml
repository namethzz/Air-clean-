name: Build AirCare Connect

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: backend/AirCare.Api
        run: dotnet restore
      - name: Build
        working-directory: backend/AirCare.Api
        run: dotnet build --no-restore --configuration Release
      - name: Test marketplace against disposable database
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: airclean_ci
          JWT_KEY: isolated-ci-signing-key-32-characters-minimum
          ASPNETCORE_ENVIRONMENT: Development
          SEED_DEMO_DATA: false
          PORT: 5080
          INITIAL_ADMIN_EMAIL: ci-admin@example.test
          INITIAL_ADMIN_PASSWORD: isolated-ci-admin-password
          TEST_ADMIN_EMAIL: ci-admin@example.test
          TEST_ADMIN_PASSWORD: isolated-ci-admin-password
          GOOGLE_CLIENT_ID: ci-google-client.apps.googleusercontent.com
          APPLE_CLIENT_ID: ci.airclean.signin
          GOOGLE_OIDC_AUTHORITY: http://localhost:5099/google
          APPLE_OIDC_AUTHORITY: http://localhost:5099/apple
          TEST_OIDC_PORT: 5099
        run: |
          dotnet backend/AirCare.Api/bin/Release/net8.0/AirCare.Api.dll > /tmp/airclean-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python3 -m pip install --quiet cryptography pymongo
          if ! python3 tests/marketplace_smoke.py; then
            cat /tmp/airclean-api.log
            exit 1
          fi

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
