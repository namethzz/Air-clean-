name: Build AirCare Connect

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: backend/AirCare.Api
        run: dotnet restore
      - name: Build
        working-directory: backend/AirCare.Api
        run: dotnet build --no-restore --configuration Release

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
