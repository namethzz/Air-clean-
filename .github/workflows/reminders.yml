name: Reminders

# Wakes the API every 30 minutes between 07:00 and 21:00 Thai time so reminders go out on time even when the
# free server is asleep. Needs two repository secrets: AIRCLEAN_API_URL (e.g. https://your-api.onrender.com)
# and AIRCLEAN_CRON_KEY (the same value as CRON_KEY on the server). Without them this does nothing.
on:
  schedule:
    - cron: '*/30 0-14 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminders
        env:
          API_URL: ${{ secrets.AIRCLEAN_API_URL }}
          CRON_KEY: ${{ secrets.AIRCLEAN_CRON_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_KEY" ]; then echo "Reminder secrets are not set; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 \
            -X POST -H "X-Cron-Key: $CRON_KEY" "${API_URL%/}/api/cron/reminders"
